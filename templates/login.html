<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - AI SOC Assistant</title>
    <style>
        :root {
            --bg: #020617;
            --panel: rgba(3, 7, 18, 0.92);
            --border: rgba(0, 255, 156, 0.25);
            --green: #00ff9c;
            --cyan: #00d9ff;
            --text: #d1fae5;
            --muted: #94a3b8;
            --danger: #fb7185;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(0,217,255,0.12), transparent 25%),
                radial-gradient(circle at bottom right, rgba(0,255,156,0.10), transparent 25%),
                #020617;
            color: var(--text);
            font-family: Consolas, "Courier New", monospace;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 420px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow:
                0 0 30px rgba(0,0,0,0.55),
                0 0 18px rgba(0,255,156,0.10);
            overflow: hidden;
        }

        .terminal-header {
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid rgba(0,255,156,0.14);
            background: linear-gradient(90deg, rgba(0,255,156,0.09), rgba(0,217,255,0.07));
        }

        .dots {
            display: flex;
            gap: 7px;
        }

        .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
        }

        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green-dot { background: #27c93f; }

        .terminal-title {
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 1px;
        }

        .content {
            padding: 28px;
        }

        .brand {
            color: var(--green);
            font-size: 26px;
            font-weight: bold;
            text-shadow:
                0 0 8px rgba(0,255,156,0.45),
                0 0 18px rgba(0,255,156,0.18);
            margin-bottom: 8px;
        }

        .brand::before {
            content: ">";
            color: var(--cyan);
            margin-right: 8px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        label {
            display: block;
            color: var(--green);
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            background: rgba(2, 6, 23, 0.9);
            color: var(--text);
            border: 1px solid rgba(0,255,156,0.22);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 16px;
            font-family: Consolas, "Courier New", monospace;
            outline: none;
        }

        input:focus {
            border-color: var(--green);
            box-shadow: 0 0 14px rgba(0,255,156,0.12);
        }

        button {
            width: 100%;
            background: linear-gradient(90deg, rgba(0,255,156,0.10), rgba(0,217,255,0.08));
            color: var(--green);
            border: 1px solid rgba(0,255,156,0.30);
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-family: Consolas, "Courier New", monospace;
            font-weight: bold;
        }

        button:hover {
            color: var(--cyan);
            border-color: var(--cyan);
            box-shadow: 0 0 16px rgba(0,217,255,0.20);
        }

        .erro {
            color: var(--danger);
            border: 1px solid rgba(251,113,133,0.25);
            background: rgba(251,113,133,0.08);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .footer {
            color: var(--muted);
            font-size: 12px;
            margin-top: 18px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="terminal-header">
            <div class="dots">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green-dot"></span>
            </div>
            <div class="terminal-title">SECURE_LOGIN</div>
        </div>

        <div class="content">
            <div class="brand">AI SOC Assistant</div>
            <div class="subtitle">
                Acesso restrito ao console de análise Wazuh + Suricata + Sysmon + IA.
            </div>

            {% if erro %}
            <div class="erro">{{ erro }}</div>
            {% endif %}

            <form method="POST">
                <label>Usuário</label>
                <input type="text" name="usuario" autocomplete="username" required>

                <label>Senha</label>
                <input type="password" name="senha" autocomplete="current-password" required>

                <button type="submit">[ AUTENTICAR ]</button>
            </form>

            <div class="footer">
                Fonte: Wazuh Indexer | Interface protegida por login simples Flask
            </div>
        </div>
    </div>
</body>
</html>
